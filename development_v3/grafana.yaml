apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Inference Platform
        orgId: 1
        folder: AI Inference Platform
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-dashboard
data:
  inference-platform.json: |
    {
      "uid": "inference-platform",
      "title": "AI Inference Platform",
      "tags": ["inference", "kubernetes", "monitoring"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "Inference Requests by Model and Outcome",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (model, status) (rate(inference_requests_total[5m]))",
              "legendFormat": "{{model}} - {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Average End-to-End Inference Duration",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum by (model) (rate(inference_duration_seconds_sum[5m])) / sum by (model) (rate(inference_duration_seconds_count[5m]))",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Gateway HTTP Requests per Second",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{app=\"gateway\"}[5m]))",
              "legendFormat": "HTTP {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Worker Inference Requests",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum by (worker, model, status) (rate(worker_inference_requests_total[5m]))",
              "legendFormat": "{{worker}} - {{model}} - {{status}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: providers
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: inference-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
