apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-worker-v3-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference-worker-v3-2
  template:
    metadata:
      labels:
        app: ai-inference-worker-v3-2
    spec:
      containers:
        - name: worker
          image: ai-inference-platform:dev3.1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args: ["worker_api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: WORKER_ID
              value: worker-2
            - name: OMP_NUM_THREADS
              value: "2"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference-worker-v3-2
spec:
  type: ClusterIP
  selector:
    app: ai-inference-worker-v3-2
  ports:
    - port: 8000
      targetPort: 8000
